  <circle cx="410" cy="82" r="150" fill="#7C3AED" opacity="0.18"/>
  <circle cx="110" cy="430" r="165" fill="#0EA5E9" opacity="0.10"/>
  <circle cx="256" cy="256" r="176" fill="#081426" fill-opacity="0.58" stroke="url(#ring)" stroke-width="6" filter="url(#glow)"/>
  <text x="256" y="305" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="146" font-weight="800" letter-spacing="-12">TJ</text>
  <circle cx="128" cy="126" r="8" fill="#7DD3FC"/>
  <circle cx="386" cy="382" r="8" fill="#C4B5FD"/>
  <path d="M135 131L184 178M378 376L331 331" stroke="url(#ring)" stroke-width="4" opacity="0.75"/>
