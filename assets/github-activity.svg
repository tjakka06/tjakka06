<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="252" viewBox="0 0 1200 252" role="img" aria-labelledby="title desc">
  <title id="title">Where I build</title>
  <desc id="desc">Most day-to-day engineering happens in private team repositories; Titan is a public distributed-systems project with code available to review.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="0.58" stop-color="#102A56"/>
      <stop offset="1" stop-color="#31206A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0V32H0" fill="none" stroke="#93C5FD" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="252" rx="20" fill="url(#background)"/>
  <rect width="1200" height="252" rx="20" fill="url(#grid)"/>
  <rect x="32" y="32" width="549" height="188" rx="16" fill="#071426" fill-opacity="0.72" stroke="#38BDF8" stroke-opacity="0.42"/>
  <rect x="619" y="32" width="549" height="188" rx="16" fill="#071426" fill-opacity="0.72" stroke="#A78BFA" stroke-opacity="0.45"/>
  <rect x="32" y="32" width="549" height="5" rx="2.5" fill="#38BDF8"/>
  <rect x="619" y="32" width="549" height="5" rx="2.5" fill="#A78BFA"/>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="62" y="77" fill="#7DD3FC" font-size="15" font-weight="700" letter-spacing="2">DAY-TO-DAY ENGINEERING</text>
    <text x="62" y="123" fill="#F8FAFC" font-size="31" font-weight="700">Private team repositories</text>
    <text x="62" y="158" fill="#CBD5E1" font-size="17">Production APIs · data platforms · internal tools</text>
    <text x="62" y="190" fill="#94A3B8" font-size="14">Professional outcomes are highlighted above</text>

    <text x="649" y="77" fill="#C4B5FD" font-size="15" font-weight="700" letter-spacing="2">PUBLIC CODE TO EXPLORE</text>
    <text x="649" y="123" fill="#F8FAFC" font-size="31" font-weight="700">Titan</text>
    <text x="649" y="158" fill="#CBD5E1" font-size="17">Distributed task orchestration in Go</text>
    <text x="649" y="190" fill="#94A3B8" font-size="14">gRPC · Redis · Docker · fault recovery</text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5">
    <rect x="517" y="107" width="29" height="25" rx="5" stroke="#7DD3FC"/>
    <path d="M523 107v-7a8.5 8.5 0 0 1 17 0v7" stroke="#7DD3FC"/>
    <circle cx="531.5" cy="119.5" r="2" fill="#7DD3FC" stroke="none"/>
    <path d="m1104 103-12 13 12 13m29-26 12 13-12 13m-10-31-9 36" stroke="#C4B5FD"/>
  </g>
  <rect x="469" y="224" width="262" height="2" rx="1" fill="url(#accent)" opacity="0.6"/>
</svg>
