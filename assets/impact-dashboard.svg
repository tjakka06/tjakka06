<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">Engineering impact</title>
  <desc id="desc">Four metrics: 99 percent API latency reduction, CI metadata retrieval in under five seconds, more than 10 thousand concurrent tasks, and a 150 millisecond p95 marketplace latency budget.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1930"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="270" rx="24" fill="#07111F"/>
  <text x="42" y="46" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700" letter-spacing="2">ENGINEERING IMPACT</text>
  <rect x="42" y="61" width="1116" height="3" rx="1.5" fill="url(#accent)" opacity="0.75"/>

  <g filter="url(#shadow)">
    <rect x="42" y="88" width="258" height="142" rx="16" fill="url(#panel)" stroke="#1E3A5F"/>
    <rect x="322" y="88" width="258" height="142" rx="16" fill="url(#panel)" stroke="#1E3A5F"/>
    <rect x="602" y="88" width="258" height="142" rx="16" fill="url(#panel)" stroke="#1E3A5F"/>
    <rect x="882" y="88" width="276" height="142" rx="16" fill="url(#panel)" stroke="#1E3A5F"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="66" y="151" fill="#7DD3FC" font-size="44" font-weight="800">99%</text>
    <text x="66" y="183" fill="#F8FAFC" font-size="16" font-weight="650">API LATENCY REDUCTION</text>
    <text x="66" y="207" fill="#94A3B8" font-size="13">PostgreSQL query optimization</text>

    <text x="346" y="151" fill="#7DD3FC" font-size="44" font-weight="800">&lt;5s</text>
    <text x="346" y="183" fill="#F8FAFC" font-size="16" font-weight="650">CI METADATA LOOKUP</text>
    <text x="346" y="207" fill="#94A3B8" font-size="13">Reduced from 20 minutes</text>

    <text x="626" y="151" fill="#C4B5FD" font-size="44" font-weight="800">10k+</text>
    <text x="626" y="183" fill="#F8FAFC" font-size="16" font-weight="650">CONCURRENT TASKS</text>
    <text x="626" y="207" fill="#94A3B8" font-size="13">Titan orchestration engine</text>

    <text x="906" y="151" fill="#C4B5FD" font-size="44" font-weight="800">150ms</text>
    <text x="906" y="183" fill="#F8FAFC" font-size="16" font-weight="650">P95 LATENCY BUDGET</text>
    <text x="906" y="207" fill="#94A3B8" font-size="13">100K+ item discovery system</text>
  </g>
</svg>
