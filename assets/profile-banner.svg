  <text x="70" y="141" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="62" font-weight="750" letter-spacing="-1.2">Tejaswini Jakka</text>
  <text x="73" y="197" fill="#A8EAF5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="29" font-weight="600">Software Developer Engineer</text>
  <text x="73" y="242" fill="#D1DBEC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" letter-spacing="0.7">FULL-STACK PRODUCTS  ·  DISTRIBUTED SYSTEMS  ·  DATA PLATFORMS</text>
