<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Tejaswini Jakka - Software Developer Engineer</title>
  <desc id="desc">A clean blue-violet banner featuring Tejaswini Jakka's name, role, and engineering focus.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061623"/>
      <stop offset="0.52" stop-color="#12335F"/>
      <stop offset="1" stop-color="#42247D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#28D7D1"/>
      <stop offset="0.55" stop-color="#4DA7FF"/>
      <stop offset="1" stop-color="#A87CFF"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#93C5FD" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#background)"/>
