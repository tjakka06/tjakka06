<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Tejaswini Jakka - Software Developer Engineer</title>
  <desc id="desc">Tejaswini Jakka, Software Developer Engineer, on a blue-violet editorial banner with a TJ monogram.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061623"/>
      <stop offset="0.52" stop-color="#12335F"/>
      <stop offset="1" stop-color="#42247D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#28D7D1"/>
      <stop offset="0.55" stop-color="#4DA7FF"/>
      <stop offset="1" stop-color="#A87CFF"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#93C5FD" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#background)"/>
  <rect width="1200" height="300" rx="22" fill="url(#grid)"/>
  <circle cx="1137" cy="15" r="174" fill="#9B5CFF" opacity="0.11"/>
  <circle cx="1176" cy="282" r="180" fill="#1DE2D4" opacity="0.07"/>

  <g transform="translate(829 40)">
    <rect width="323" height="220" rx="23" fill="#081A2F" fill-opacity="0.82" stroke="#8CB7E9" stroke-opacity="0.27"/>
    <path d="M27 32h269M27 188h269" stroke="#8CB7E9" stroke-opacity="0.19"/>
    <rect x="27" y="30" width="72" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="25" y="152" fill="url(#accent)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="126" font-weight="800" letter-spacing="-11">TJ.</text>
    <text x="28" y="207" fill="#C9D7EC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.2">BUILD  /  SHIP  /  SCALE</text>
  </g>

  <rect x="70" y="57" width="90" height="6" rx="3" fill="url(#accent)"/>
  <text x="70" y="126" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="51" font-weight="750" letter-spacing="-0.5">Tejaswini Jakka</text>
  <text x="72" y="174" fill="#A8EAF5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="600">Software Developer Engineer</text>
  <text x="72" y="218" fill="#D1DBEC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" letter-spacing="0.5">FULL-STACK PRODUCTS  ·  DISTRIBUTED SYSTEMS  ·  DATA PLATFORMS</text>
</svg>
