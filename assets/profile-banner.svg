<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Tejaswini Jakka - Software Developer Engineer</title>
  <desc id="desc">A dark blue and violet technical banner with a minimal code editor illustration.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="0.52" stop-color="#102A56"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#93C5FD" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#background)"/>
  <rect width="1200" height="300" rx="22" fill="url(#grid)"/>
  <circle cx="1050" cy="48" r="150" fill="#7C3AED" opacity="0.11"/>
  <circle cx="1138" cy="260" r="180" fill="#0EA5E9" opacity="0.08"/>

  <g transform="translate(830 47)">
    <rect width="318" height="208" rx="14" fill="#071426" fill-opacity="0.78" stroke="#93C5FD" stroke-opacity="0.32"/>
    <path d="M0 37H318" stroke="#93C5FD" stroke-opacity="0.2"/>
    <circle cx="18" cy="19" r="4" fill="#38BDF8"/>
    <circle cx="32" cy="19" r="4" fill="#818CF8"/>
    <circle cx="46" cy="19" r="4" fill="#A78BFA"/>
    <text x="72" y="24" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" letter-spacing="1.2">ENGINEERING / BUILD</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
      <text x="21" y="75" fill="#64748B">01</text>
      <text x="57" y="75" fill="#7DD3FC">const</text>
      <text x="115" y="75" fill="#E2E8F0">developer = {</text>
      <text x="21" y="107" fill="#64748B">02</text>
      <text x="75" y="107" fill="#C4B5FD">build:</text>
      <text x="145" y="107" fill="#BAE6FD">"products",</text>
      <text x="21" y="139" fill="#64748B">03</text>
      <text x="75" y="139" fill="#C4B5FD">scale:</text>
      <text x="145" y="139" fill="#BAE6FD">"systems",</text>
      <text x="21" y="171" fill="#64748B">04</text>
      <text x="57" y="171" fill="#E2E8F0">};</text>
    </g>
    <rect x="20" y="188" width="278" height="2" rx="1" fill="url(#accent)" opacity="0.45"/>
  </g>

  <rect x="70" y="56" width="76" height="6" rx="3" fill="url(#accent)"/>
  <text x="70" y="125" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="48" font-weight="700" letter-spacing="0.3">Tejaswini Jakka</text>
  <text x="72" y="171" fill="#BAE6FD" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="500">Software Developer Engineer</text>
  <text x="72" y="216" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" letter-spacing="0.5">FULL-STACK PRODUCTS  ·  DISTRIBUTED SYSTEMS  ·  CLOUD PLATFORMS</text>
